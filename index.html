<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14202e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Field Guide">
  <title>Field Guide</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Apply saved theme and text size before first paint
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem("theme") || '"auto"');
        var s = JSON.parse(localStorage.getItem("textSize") || "1");
        if (t !== "auto") document.documentElement.dataset.theme = t;
        document.documentElement.style.setProperty("--scale", s);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <button class="back" id="back-btn" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 4.5L7.5 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="back-label">Home</span>
    </button>
    <a class="topbar-title" id="nav-title" href="#/">Field Guide</a>
    <div class="top-actions">
      <a class="icon-btn" id="home-btn" href="#/" aria-label="Home" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-6.5 8 6.5M6.5 9.5V19h11V9.5"/></svg>
      </a>
      <a class="icon-btn text" href="#/settings" aria-label="Display settings">Aa</a>
    </div>
  </header>

  <main id="app"></main>

  <!-- Verse popup -->
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>

  <script src="data/verses.js"></script>
  <script src="data/paths.js"></script>
  <script src="data/talking.js"></script>
  <script src="data/objections.js"></script>
  <script src="data/skills.js"></script>
  <script src="data/claims.js"></script>
  <script src="data/evidence.js"></script>
  <script src="data/openers.js"></script>
  <script src="data/worldviews.js"></script>
  <script src="data/convictions.js"></script>
  <script src="data/books.js"></script>
  <script src="data/quiz.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
