<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14202e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Field Guide">
  <title>Gospel Field Guide</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Apply saved theme and text size before first paint
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem("theme") || '"auto"');
        var s = JSON.parse(localStorage.getItem("textSize") || "1");
        if (t !== "auto") document.documentElement.dataset.theme = t;
        document.documentElement.style.setProperty("--scale", s);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="back-btn" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" width="26" height="26"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <a class="topbar-title" id="topbar-title" href="#/">Field Guide</a>
    <a class="icon-btn settings-btn" href="#/settings" aria-label="Settings">Aa</a>
  </header>

  <main id="app"></main>

  <!-- Verse popup -->
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>

  <script src="data/verses.js"></script>
  <script src="data/paths.js"></script>
  <script src="data/objections.js"></script>
  <script src="data/skills.js"></script>
  <script src="data/evidence.js"></script>
  <script src="data/openers.js"></script>
  <script src="data/worldviews.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
